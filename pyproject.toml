[project]
name = "accent-coach"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cmudict>=1.1.3",
    "fastapi>=0.146.0",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
