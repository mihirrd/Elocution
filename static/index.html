<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>American Accent Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <h1>American Accent Coach</h1>
    <div class="masthead-meta">
      <span id="model-status" class="status loading">Loading models…</span>
      <label class="toggle"><input type="checkbox" id="toggle-ipa"> IPA</label>
    </div>
  </header>

  <nav class="chapters" role="tablist">
    <button class="tab active" data-tab="practice"><span class="num">I.</span> Practice</button>
    <button class="tab" data-tab="free"><span class="num">II.</span> Free speech</button>
    <button class="tab" data-tab="lookup"><span class="num">III.</span> Lookup</button>
  </nav>

  <main>
    <!-- Practice / free speech share the recorder -->
    <section id="record-panel" class="sheet">
      <div id="practice-controls">
        <div id="focus-chips" class="contents"></div>
        <figure class="epigraph">
          <textarea id="target" rows="2" spellcheck="false" aria-label="Sentence to say"></textarea>
          <figcaption>
            <div id="target-ipa" class="ipa-line"></div>
            <button id="btn-listen-target" class="mini">Listen</button>
          </figcaption>
        </figure>
        <p class="key">CAPS = stressed</p>
      </div>
      <div id="free-controls" hidden>
        <p class="hint">Say anything.</p>
      </div>

      <div class="recorder">
        <button id="btn-record" class="record" aria-label="Record"><span class="dot"></span></button>
        <div class="rec-info">
          <div id="rec-state">Record</div>
          <div id="rec-timer" class="timer">0:00</div>
        </div>
        <audio id="playback" controls hidden></audio>
      </div>
      <div id="error" class="error-box" hidden></div>
    </section>

    <section id="results" class="sheet" hidden>
      <div class="results-head">
        <div class="score-ring" id="score-ring"><span id="score">0</span></div>
        <div class="results-summary">
          <p id="verdict" class="verdict"></p>
          <p class="heard-row">Heard as <em id="transcript"></em></p>
        </div>
      </div>

      <div id="word-chips" class="manuscript"></div>

      <article id="word-detail" class="entry" hidden></article>

      <div id="patterns-box" hidden>
        <h3 class="minor-title">Recurring mistakes</h3>
        <ol id="patterns" class="errata"></ol>
      </div>

      <details class="collation">
        <summary>Whole sentence</summary>
        <div><span class="sc">Say it like</span> <strong id="expected-respelling"></strong></div>
        <div><span class="sc">You said</span> <span id="heard-respelling"></span></div>
        <div class="ipa-only"><span class="sc">IPA</span> <span id="expected-ipa" class="ipa"></span></div>
        <div class="ipa-only"><span class="sc">Yours</span> <span id="heard-ipa" class="ipa"></span></div>
      </details>
    </section>

    <section id="lookup-panel" class="sheet" hidden>
      <form id="lookup-form" class="lookup-row">
        <input id="lookup-input" placeholder="Word or sentence" autocomplete="off" aria-label="Word or sentence to look up">
        <button type="submit">Look up</button>
      </form>
      <div id="lookup-results"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
